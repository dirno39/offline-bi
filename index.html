<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offline BI</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%233563e9'/%3E%3Crect x='7.5' y='16' width='4.5' height='9' rx='2.25' fill='%23fff' fill-opacity='.55'/%3E%3Crect x='13.75' y='11' width='4.5' height='14' rx='2.25' fill='%23fff' fill-opacity='.8'/%3E%3Crect x='20' y='6.5' width='4.5' height='18.5' rx='2.25' fill='%23fff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app">
  <header id="toolbar">
    <div class="brand"><svg viewBox="0 0 32 32" width="24" height="24" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#3563e9"/><rect x="7.5" y="16" width="4.5" height="9" rx="2.25" fill="#fff" fill-opacity=".55"/><rect x="13.75" y="11" width="4.5" height="14" rx="2.25" fill="#fff" fill-opacity=".8"/><rect x="20" y="6.5" width="4.5" height="18.5" rx="2.25" fill="#fff"/></svg><span>Offline BI</span></div>
    <button class="tbtn" data-cmd="fileMenu"><span>파일</span><svg class="chev" viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 6.5l3 3 3-3"/></svg></button>
    <span class="tsep"></span>
    <button class="tbtn" data-cmd="addData" title="데이터 파일 추가 (CSV, Excel)"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="11" cy="5" rx="7" ry="2.5"/><path d="M4 5v12c0 1.4 3.1 2.5 7 2.5M18 5v6M4 11c0 1.4 3.1 2.5 7 2.5"/><path d="M18 14v7M14.5 17.5h7"/></svg><span>데이터 추가</span></button>
    <span class="tsep"></span>
    <button class="tbtn icon" data-cmd="undo" title="실행 취소 (Ctrl+Z)"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg></button>
    <button class="tbtn icon" data-cmd="redo" title="다시 실행 (Ctrl+Y)"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14l5-5-5-5"/><path d="M20 9H9a5 5 0 0 0 0 10h3"/></svg></button>
    <span class="tsep"></span>
    <button class="tbtn" data-cmd="newSheet" title="새 워크시트"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 15v3M11 11v7"/><path d="M15 4h6M18 1v6"/></svg><span>새 시트</span></button>
    <button class="tbtn" data-cmd="newDash" title="새 대시보드"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="8" height="8"/><rect x="3" y="13" width="8" height="8"/><rect x="13" y="13" width="8" height="8"/><path d="M14 7h6M17 4v6"/></svg><span>새 대시보드</span></button>
    <span class="tsep"></span>
    <button class="tbtn icon" data-cmd="swap" title="행과 열 바꾸기"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4v16M7 20l-3-3M7 20l3-3M17 20V4M17 4l-3 3M17 4l3 3"/></svg></button>
    <button class="tbtn icon toggle" data-cmd="sortAsc" title="오름차순 정렬 (다시 누르면 해제)"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h5M4 12h9M4 18h13"/><path d="M19 15V4M16 7l3-3 3 3"/></svg></button>
    <button class="tbtn icon toggle" data-cmd="sortDesc" title="내림차순 정렬 (다시 누르면 해제)"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h13M4 12h9M4 18h5"/><path d="M19 4v11M16 12l3 3 3-3"/></svg></button>
    <button class="tbtn icon" data-cmd="clear" title="시트 지우기"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg></button>
    <button class="tbtn" data-cmd="calc" title="계산된 필드 만들기"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 7h8M8 12h2M14 12h2M8 16h2M14 16h2"/></svg><span>계산된 필드</span></button>
    <button class="tbtn" data-cmd="viewData" title="데이터 보기"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="1"/><path d="M3 9h18M3 14h18M9 4v16"/></svg><span>데이터 보기</span></button>
    <button class="tbtn" data-cmd="exportMenu" title="내보내기"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10l5 5 5-5M4 19h16"/></svg><span>내보내기</span><svg class="chev" viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 6.5l3 3 3-3"/></svg></button>
    <span class="grow"></span>
    <span id="wbName" class="wb-name" title="통합 문서 이름"></span>
    <button class="tbtn toggle" data-cmd="showMe" title="표현 방식 패널"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg><span>표현 방식</span></button>
    <button class="tbtn icon" data-cmd="help" title="도움말"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6V14M12 17.5v.5"/></svg></button>
  </header>
  <main id="main"></main>
  <footer id="tabs"></footer>
</div>
<input type="file" id="fileData" multiple accept=".csv,.tsv,.txt,.dat,.prn,.xlsx,.xls,.xlsm,.xlsb,.ods,.json" hidden>
<input type="file" id="fileWb" accept=".obi,.json" hidden>
<div class="file-drop-ov"><div>파일을 놓으면 데이터 원본으로 추가됩니다</div></div>

<!-- 외부 라이브러리 (로컬 번들, 인터넷 불필요) -->
<script src="lib/echarts.min.js"></script>
<script src="lib/xlsx.full.min.js"></script>
<!-- 애플리케이션 -->
<script src="js/util.js"></script>
<script src="js/data.js"></script>
<script src="js/prep.js"></script>
<script src="js/calc.js"></script>
<script src="js/query.js"></script>
<script src="js/charts.js"></script>
<script src="js/app.js"></script>
<script src="js/ui-sheet.js"></script>
<script src="js/ui-dash.js"></script>
<script src="js/ui-ds.js"></script>
<script src="js/ui-prep.js"></script>
</body>
</html>
